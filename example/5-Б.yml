class_name: '5-Б'

semester_name_in_title: 1 і 2 семестри

schedule:
- iso_weekday: 1 # Monday
  lessons_count: 2 # on this week config
  week_number: null # same every week

textbooks:
- grade: 5 клас
  title: 'Н. В. Морзе, О. В. Барна M79 Інформатика: Підручник для 5 кл. закладів загальної середньої освіти / Н. В. Морзе, О. В. Барна. — Київ: УОВЦ «Оріон», 2023. - 256 с. : іл.'

programs:
- grade: 5 клас
  title: 'Типова освітня програма для 5-9 класів закладів загальної середньої освіти, затверджена наказом Міністерства освіти і науки України від 19.02.2021 р. № 235, зі змінами від 09.08.2024 № 1120, додаток 3'

semesters:
- topics:
  - title: Інформація
    lessons:
    - topic: Правила роботи за комп’ютером
      homework: Записати в зошит два правила безпечної роботи за комп’ютером.
      safety_topic: Первинний інструктаж з БЖД.
    - topic: Інформація та її значення в житті людини
      homework: Записати два приклади інформації, яку людина отримує щодня.
      safety_topic: Інструктаж з БЖД.
    - topic: Інформація за способом сприйняття
      homework: Намалювати око, вухо та руку. Підписати, як ми отримуємо інформацію.
      safety_topic: Інструктаж з БЖД.
    - topic: Повідомлення та способи їх подання
      homework: Записати одне коротке повідомлення для друга.
      safety_topic: Інструктаж з БЖД.
    - topic: Перетворення інформації. Носії повідомлень
      homework: Записати назви двох носіїв інформації. За бажанням намалювати їх.
      safety_topic: Інструктаж з БЖД.
    - topic: Кодування інформації
      homework: Придумати три умовні знаки та записати, що вони означають.
      safety_topic: Інструктаж з БЖД.
    - topic: Декодування інформації
      homework: 'Розшифрувати запис: А=1, Б=2, В=3; 1–2–3. Записати відповідь.'
      safety_topic: Інструктаж з БЖД.
    - topic: Символи та способи кодування повідомлень
      homework: Намалювати два умовні знаки та підписати їх значення.
      safety_topic: Інструктаж з БЖД.
    - topic: Практичні завдання з кодування та декодування
      homework: Скласти коротке повідомлення з трьох умовних знаків.
      safety_topic: Інструктаж з БЖД.
    - topic: Структурування інформації
      homework: Записати три назви предметів і розподілити їх на дві групи.
      safety_topic: Інструктаж з БЖД.
    - topic: Файли та папки
      homework: Намалювати дві папки та записати, які файли можна в них зберігати.
      safety_topic: Інструктаж з БЖД.
    - topic: Тематичне оцінювання
      homework: Повторити три слова з теми «Інформація» та записати їх у зошит.
      safety_topic: Інструктаж з БЖД.
  - title: Комп’ютерна техніка та комп’ютерні пристрої
    lessons:
    - topic: Комп’ютер як пристрій для роботи з інформацією
      homework: Записати два приклади використання комп’ютера.
      safety_topic: Інструктаж з БЖД.
    - topic: Пристрої комп’ютера та їх призначення
      homework: Записати назви трьох пристроїв комп’ютера.
      safety_topic: Інструктаж з БЖД.
    - topic: Ручні та електричні пристрої
      homework: Назвати та записати по одному ручному й електричному пристрою.
      safety_topic: Інструктаж з БЖД.
    - topic: Різновиди комп’ютерів
      homework: Записати назви двох видів комп’ютерів.
      safety_topic: Інструктаж з БЖД.
    - topic: Стаціонарні та портативні комп’ютери
      homework: Намалювати настільний комп’ютер і ноутбук. Підписати малюнки.
      safety_topic: Інструктаж з БЖД.
    - topic: Історія обчислювальної техніки
      homework: Розглянути малюнки на с. 62–64. Записати одну відмінність старого комп’ютера від сучасного.
      safety_topic: Інструктаж з БЖД.
    - topic: Перші обчислювальні машини
      homework: Намалювати обчислювальний пристрій минулого за зразком із підручника.
      safety_topic: Інструктаж з БЖД.
    - topic: Пристрої введення інформації
      homework: Записати два пристрої введення інформації.
      safety_topic: Інструктаж з БЖД.
    - topic: Пристрої виведення інформації
      homework: Записати два пристрої виведення інформації.
      safety_topic: Інструктаж з БЖД.
    - topic: Пристрої введення і виведення інформації
      homework: Розподілити в зошиті слова «миша», «монітор», «клавіатура» на пристрої введення та виведення.
      safety_topic: Інструктаж з БЖД.
    - topic: Комп’ютерна миша
      homework: Намалювати комп’ютерну мишу та підписати її дві кнопки.
      safety_topic: Інструктаж з БЖД.
    - topic: Робота з комп’ютерною мишею
      homework: Записати дві дії, які можна виконати комп’ютерною мишею.
      safety_topic: Інструктаж з БЖД.
    - topic: Клавіатура. Основні групи клавіш
      homework: Записати назви трьох знайомих клавіш.
      safety_topic: Інструктаж з БЖД.
    - topic: Розташування клавіш на клавіатурі
      homework: Знайти на малюнку клавіатури клавіші Enter, Space і Backspace. Записати їхні назви.
      safety_topic: Інструктаж з БЖД.
    - topic: Правильне розташування пальців на клавіатурі
      homework: Намалювати клавіатуру схематично та позначити місце для лівої й правої руки.
      safety_topic: Інструктаж з БЖД.
    - topic: Практична робота. Знайомство з клавіатурою
      homework: Записати, для чого потрібні клавіші Enter і Пробіл.
      safety_topic: Інструктаж з БЖД.
    - topic: Введення тексту з клавіатури
      homework: Записати на аркуші своє ім’я та два короткі слова для тренування набору.
      safety_topic: Інструктаж з БЖД.
    - topic: Тематичне оцінювання
      homework: Повторити назви трьох пристроїв комп’ютера та записати їх.
      safety_topic: Інструктаж з БЖД.
  terms:
  - start: '2026-09-01'
    end: '2026-10-25'
  - start: '2026-11-02'
    end: '2026-12-23'
- topics:
  - title: Об’єкти, властивості та моделі
    lessons:
    - topic: Об’єкти навколишнього світу
      homework: Записати назви трьох предметів навколо себе.
      safety_topic: Інструктаж з БЖД.
    - topic: Властивості об’єктів
      homework: Вибрати предмет і записати його колір, форму та розмір.
      safety_topic: Інструктаж з БЖД.
    - topic: Порівняння та групування об’єктів
      homework: Розподілити слова «яблуко», «м’яч», «груша», «лялька» на дві групи.
      safety_topic: Інструктаж з БЖД.
    - topic: Моделі об’єктів
      homework: Намалювати предмет і його спрощену модель.
      safety_topic: Інструктаж з БЖД.
    - topic: Матеріальні моделі
      homework: Записати два приклади матеріальних моделей.
      safety_topic: Інструктаж з БЖД.
    - topic: Інформаційні моделі
      homework: Намалювати просту схему своєї кімнати із трьома предметами.
      safety_topic: Інструктаж з БЖД.
    - topic: Форми подання інформаційних моделей
      homework: 'Записати дві форми подання інформаційних моделей: малюнок і схема.'
      safety_topic: Інструктаж з БЖД.
    - topic: Розпізнавання матеріальних та інформаційних моделей
      homework: 'Записати, що є моделлю: іграшкова машина чи справжня машина. Пояснити одним реченням.'
      safety_topic: Інструктаж з БЖД.
    - topic: Практичні завдання з теми «Моделі»
      homework: Намалювати просту схему дороги від парти до дверей класу.
      safety_topic: Інструктаж з БЖД.
    - topic: Тематичне оцінювання
      homework: Повторити та записати два приклади моделей.
      safety_topic: Інструктаж з БЖД.
  - title: Комп’ютерні програми. Графічний редактор
    lessons:
    - topic: Комп’ютерні програми та їх призначення
      homework: Записати назви двох комп’ютерних програм, які вже знайомі.
      safety_topic: Інструктаж з БЖД.
    - topic: Графічний редактор Paint
      homework: Намалювати картинку з кола та прямокутника.
      safety_topic: Інструктаж з БЖД.
    - topic: Вікно та палітра графічного редактора Paint
      homework: Намалювати чотири кольорові квадрати та підписати кольори.
      safety_topic: Інструктаж з БЖД.
    - topic: Інструменти малювання в Paint
      homework: Намалювати лінію, коло та прямокутник. Підписати фігури.
      safety_topic: Інструктаж з БЖД.
    - topic: Створення простого малюнка
      homework: Створити малюнок будиночка з трьох геометричних фігур.
      safety_topic: Інструктаж з БЖД.
    - topic: Практична робота. Створення, редагування та збереження малюнка
      homework: Намалювати простий пейзаж із двох-трьох фігур.
      safety_topic: Інструктаж з БЖД.
    - topic: Редагування графічних об’єктів
      homework: 'Намалювати коло та два варіанти його зміни: інший колір і розмір.'
      safety_topic: Інструктаж з БЖД.
    - topic: Копіювання та переміщення фрагментів зображення
      homework: Намалювати дві однакові фігури поруч.
      safety_topic: Інструктаж з БЖД.
    - topic: Зміна розміру графічних об’єктів
      homework: Намалювати маленький і великий квадрат. Підписати їх.
      safety_topic: Інструктаж з БЖД.
    - topic: Створення інформаційних моделей у графічному редакторі
      homework: Створити просту схему з трьох фігур і стрілок.
      safety_topic: Інструктаж з БЖД.
    - topic: Практична робота. Інформаційні моделі
      homework: Намалювати схему «сонце — рослина» зі стрілкою.
      safety_topic: Інструктаж з БЖД.
    - topic: Тематичне оцінювання
      homework: Повторити та записати назви трьох інструментів малювання.
      safety_topic: Інструктаж з БЖД.
  - title: Логічні висловлювання
    lessons:
    - topic: Поняття висловлювання
      homework: Записати одне правдиве твердження про школу.
      safety_topic: Інструктаж з БЖД.
    - topic: Істинні та хибні висловлювання
      homework: Записати одне правдиве й одне неправдиве твердження.
      safety_topic: Інструктаж з БЖД.
    - topic: Визначення істинності висловлювань
      homework: 'Позначити «так» або «ні»: «У квадрата чотири сторони», «Сніг гарячий».'
      safety_topic: Інструктаж з БЖД.
    - topic: Логічні завдання та ребуси
      homework: Придумати й записати одну просту загадку.
      safety_topic: Інструктаж з БЖД.
    - topic: Практичні завдання з логіки
      homework: Записати два короткі твердження та позначити, які з них правдиві.
      safety_topic: Інструктаж з БЖД.
    - topic: Тематичне оцінювання
      homework: Повторити поняття «істинне» і «хибне». Записати по одному прикладу.
      safety_topic: Інструктаж з БЖД.
  - title: Алгоритми та виконавці
    lessons:
    - topic: Алгоритм. Поняття команди
      homework: Записати три кроки миття рук у правильному порядку.
      safety_topic: Інструктаж з БЖД.
    - topic: Властивості алгоритму
      homework: Перевірити порядок дій «узяти щітку — почистити зуби — покласти щітку». Записати його.
      safety_topic: Інструктаж з БЖД.
    - topic: Способи подання алгоритмів
      homework: Записати алгоритм приготування бутерброда із трьох кроків.
      safety_topic: Інструктаж з БЖД.
    - topic: Практична робота. Алгоритми
      homework: Намалювати три малюнки, що показують послідовність одягання.
      safety_topic: Інструктаж з БЖД.
    - topic: Команди і виконавці
      homework: Записати дві прості команди для виконавця-робота.
      safety_topic: Інструктаж з БЖД.
    - topic: Система команд виконавця
      homework: Придумати три команди для виконавця та записати їх.
      safety_topic: Інструктаж з БЖД.
    - topic: Практична робота. Команди і виконавці
      homework: Записати команди «крок уперед», «поверни праворуч», «стій» у вибраному порядку.
      safety_topic: Інструктаж з БЖД.
    - topic: Лінійні алгоритми
      homework: Записати три послідовні дії для прибирання столу.
      safety_topic: Інструктаж з БЖД.
    - topic: Подання лінійного алгоритму словами, малюнками та блок-схемою
      homework: Намалювати три блоки зі стрілками та підписати кроки простої дії.
      safety_topic: Інструктаж з БЖД.
    - topic: Тематичне оцінювання
      homework: Повторити та записати три команди з будь-якого вивченого алгоритму.
      safety_topic: Інструктаж з БЖД.
  terms:
  - start: '2027-01-11'
    end: '2027-03-21'
  - start: '2027-03-29'
    end: '2027-05-28'
